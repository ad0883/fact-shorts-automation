name: Offline regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install 'requests>=2.31,<3' 'python-dotenv>=1,<2'
      - run: python -m unittest discover -v
      - run: python -S main.py --script examples/fact.json --script-only
      - run: VIDEO_WIDTH=360 VIDEO_HEIGHT=640 python -S main.py --demo
